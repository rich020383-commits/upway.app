services:
  - type: web
    name: upway-app
    env: node
    plan: free
    # El esquema ya NO se aplica aquí: un `prisma db push` dentro del build
    # obligaba a despertar la base de datos en cada deploy (cuota de compute)
    # y podía alterar el esquema de producción como efecto colateral.
    # Para aplicar cambios de esquema, ejecutar a propósito: npm run db:push
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    # El health check debe ser una ruta ligera que NO consulte la base de datos:
    # si la consulta, impide que el compute llegue a suspenderse por inactividad.
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: NODE_OPTIONS
        value: --max_old_space_size=450
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_PREMIUM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_API_URL
        sync: false
      - key: KIMI_MODEL
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_APP_ID
        sync: false
      - key: TELNYX_DEFAULT_PHONE_NUMBER
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
      - key: TELNYX_AI_ASSISTANT_ID
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
